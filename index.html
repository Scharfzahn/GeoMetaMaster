<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GeoMetaMaster – GeoGuessr Meta lernen</title>
  <meta name="description" content="Spielerisch GeoGuessr-Meta lernen: Bollards, Kennzeichen, Markierungen, Coverage und mehr – mit Spaced Repetition.">
  <meta name="theme-color" content="#0b1020">
  <meta name="color-scheme" content="dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GeoMeta">
  <link rel="preconnect" href="https://upload.wikimedia.org" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="boot" class="boot">
    <div class="boot-globe">🌍</div>
    <p>GeoMetaMaster lädt …</p>
  </div>

  <div id="shell" hidden>
    <header id="topbar">
      <a class="brand" href="#/home" aria-label="Startseite"><span class="brand-ico">🌍</span><span class="brand-txt">GeoMeta<b>Master</b></span></a>
      <div class="chips">
        <span class="chip" id="chip-streak" title="Tage-Serie">🔥 <b>0</b></span>
        <span class="chip" id="chip-level" title="Level"><span class="lvl">Lv 1</span><span class="xpbar"><i></i></span></span>
      </div>
    </header>

    <nav id="nav" aria-label="Hauptnavigation">
      <a href="#/home" data-tab="home"><span>🏠</span><em>Lernen</em></a>
      <a href="#/paths" data-tab="paths"><span>🧭</span><em>Pfade</em></a>
      <a href="#/map" data-tab="map"><span>🗺️</span><em>Karte</em></a>
      <a href="#/stats" data-tab="stats"><span>📊</span><em>Statistik</em></a>
      <a href="#/profile" data-tab="profile"><span>🏅</span><em>Profil</em></a>
    </nav>

    <main id="app" tabindex="-1"></main>
  </div>

  <div id="round" class="overlay" hidden></div>
  <div id="modal" class="overlay modal" hidden></div>
  <div id="toasts" aria-live="polite"></div>
  <canvas id="fx" aria-hidden="true"></canvas>

  <noscript><p style="padding:2rem;color:#fff">Diese App benötigt JavaScript.</p></noscript>
  <script src="app.js"></script>
</body>
</html>
